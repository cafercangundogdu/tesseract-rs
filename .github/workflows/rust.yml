name: Rust
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0  # Disable incremental compilation for CI

permissions:
  contents: read

jobs:
  # Run clippy and rustfmt checks
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        key: "lint"
    
    - name: Check formatting
      run: cargo fmt -- --check
    
    - name: Run clippy
      run: |
        cargo clippy -- -D warnings
        cargo clippy -p tesseract-rs-cli -- -D warnings
      env:
        RUSTC_WRAPPER: ""
    
    - name: Install cargo-audit
      run: |
        if ! command -v cargo-audit &> /dev/null; then
          cargo install cargo-audit --locked
        fi
      env:
        RUSTC_WRAPPER: ""
    
    - name: Run security audit
      run: cargo audit || true  # Allow audit to fail for now due to transitive dependencies
      
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install visualstudio2022buildtools
        choco install visualstudio2022-workload-vctools
    
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake
    
    # Skip sccache for now to avoid issues
    # - name: Install sccache
    #   run: cargo install sccache
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        key: "build-${{ matrix.os }}"
    
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ${{ runner.os == 'Windows' && 'C:\Users\runneradmin\AppData\Roaming\tesseract-rs' || '' }}
          ${{ runner.os == 'macOS' && '~/Library/Application Support/tesseract-rs' || '' }}
          ${{ runner.os == 'Linux' && '~/.tesseract-rs' || '' }}
        # No restore-keys on purpose: a prefix match would bring back
        # libraries compiled by an older build.rs, and the build would reuse
        # them instead of testing the current flags.
        key: ${{ runner.os }}-tesseract-artifacts-${{ hashFiles('build.rs', 'Cargo.toml') }}
    
    - name: Setup MSVC environment (Windows)
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1
    
    - name: Fix Windows linking (Rename Git's link.exe)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        # Rename Git's link.exe to avoid conflicts with MSVC
        $gitLinkPath = "C:\Program Files\Git\usr\bin\link.exe"
        if (Test-Path $gitLinkPath) {
          Rename-Item $gitLinkPath -NewName "link_git.exe" -Force
          echo "Renamed Git's link.exe to link_git.exe"
        }
      
    - name: Build
      run: |
        cargo build --verbose
        cargo build -p tesseract-rs-cli --verbose
      env:
        RUSTC_WRAPPER: ""
      
    - name: Run tests
      run: cargo test --verbose
      env:
        RUST_LOG: debug
        RUSTC_WRAPPER: ""

    - name: Run tests (embedded tessdata)
      run: cargo test --features embed-tessdata --test embedded_test --verbose
      env:
        # heb is not one of the default languages, so on a cold cache this
        # also covers the on-demand tessdata download.
        TESSERACT_EMBED_LANGUAGES: eng,heb
        RUSTC_WRAPPER: ""

    - name: Check C runtime of the built libraries (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: .github/scripts/check-msvc-runtime.ps1 -Expect dynamic
    
  # MSVC with the static C runtime (`-C target-feature=+crt-static`).
  # Unlike the Windows build above, this job does not load the MSVC developer
  # environment before building, so CMake uses the Visual Studio generator
  # instead of NMake. That is what a plain `cargo build` does on most machines.
  windows-crt-static:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
      RUSTC_WRAPPER: ""
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'
        choco install visualstudio2022buildtools
        choco install visualstudio2022-workload-vctools

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        key: "build-windows-crt-static"

    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: C:\Users\runneradmin\AppData\Roaming\tesseract-rs
        key: ${{ runner.os }}-tesseract-artifacts-crt-static-${{ hashFiles('build.rs', 'Cargo.toml') }}

    - name: Fix Windows linking (Rename Git's link.exe)
      shell: pwsh
      run: |
        $gitLinkPath = "C:\Program Files\Git\usr\bin\link.exe"
        if (Test-Path $gitLinkPath) {
          Rename-Item $gitLinkPath -NewName "link_git.exe" -Force
          echo "Renamed Git's link.exe to link_git.exe"
        }

    - name: Build
      run: |
        cargo build --verbose
        cargo build -p tesseract-rs-cli --verbose

    - name: Run tests
      run: cargo test --verbose

    # dumpbin is only on PATH inside the developer environment.
    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Check C runtime of the built libraries
      shell: pwsh
      run: .github/scripts/check-msvc-runtime.ps1 -Expect static -Exe target\debug\tesseract-rs.exe

  # Fedora installs CMake projects into lib64 by default (GNUInstallDirs),
  # unlike the Debian-based runners above. RHEL, AlmaLinux (the manylinux_2_28
  # base) and openSUSE behave the same way.
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
    - name: Install dependencies
      run: dnf -y install cargo rust cmake gcc gcc-c++ make git

    - uses: actions/checkout@v4

    - name: Run tests
      run: cargo test --verbose
      env:
        RUSTC_WRAPPER: ""

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        key: "coverage"
    
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          ~/.tesseract-rs
        key: ${{ runner.os }}-tesseract-artifacts-coverage-${{ hashFiles('build.rs', 'Cargo.toml') }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
    
    - name: Install tarpaulin
      run: |
        if ! command -v cargo-tarpaulin &> /dev/null; then
          cargo install cargo-tarpaulin --locked
        fi
    
    - name: Generate coverage report
      run: cargo tarpaulin --out xml --ignore-tests --timeout 300
      env:
        RUSTC_WRAPPER: ""
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./cobertura.xml
        fail_ci_if_error: false

  clang-openmp:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Clang build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential clang libc++-dev libc++abi-dev libomp-dev

    - name: Build OpenMP example with Clang
      run: |
        cargo build --example embedded_example --features openmp,embed-tessdata --verbose

        # Drop Cargo's copy of the CMake build tree while keeping the shared cache.
        cargo clean -p tesseract-rs
        cache_log="$RUNNER_TEMP/openmp-cache-hit.log"
        if ! cargo build --example embedded_example --features openmp,embed-tessdata -vv >"$cache_log" 2>&1 ||
           ! grep -F 'Using cached tesseract library' "$cache_log"; then
          tail -n 100 "$cache_log"
          exit 1
        fi
        test -z "$(find target/debug/build -path '*/out/tesseract/build/CMakeCache.txt' -print -quit)"
        target/debug/examples/embedded_example
      env:
        CC: clang
        CXX: clang++
        RUSTC_WRAPPER: ""
